name: Bug report
description: 报告可复现的问题
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 请描述实际结果和预期结果，不要粘贴秘密或真实 OpenID。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: macOS / Java 21 / 微信开发者工具版本
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
