spring:
  datasource:
    url: jdbc:h2:mem:takeaway-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

app:
  identity:
    mode: debug
  local-seed:
    enabled: false
  notification:
    mode: log
    dispatch-delay-ms: 60000
  storage:
    directory: target/test-uploads

