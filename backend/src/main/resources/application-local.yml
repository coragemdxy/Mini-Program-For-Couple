spring:
  datasource:
    url: jdbc:h2:file:./.data/takeaway;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false

app:
  local-seed:
    enabled: true

logging:
  level:
    love.takeaway: INFO

