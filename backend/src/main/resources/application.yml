spring:
  application:
    name: takeaway-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  identity:
    mode: ${APP_IDENTITY_MODE:debug}
    debug-header: X-Debug-Openid
    wechat-header: X-WX-OPENID
  notification:
    mode: ${APP_NOTIFICATION_MODE:log}
    dispatch-delay-ms: ${APP_NOTIFICATION_DISPATCH_DELAY_MS:10000}
    batch-size: ${APP_NOTIFICATION_BATCH_SIZE:20}
  storage:
    directory: ${APP_STORAGE_DIRECTORY:.data/uploads}
  bootstrap:
    merchant-code: ${APP_BOOTSTRAP_MERCHANT_CODE:}
    valid-days: ${APP_BOOTSTRAP_MERCHANT_VALID_DAYS:7}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    new-order-template-id: ${WECHAT_NEW_ORDER_TEMPLATE_ID:}
    order-status-template-id: ${WECHAT_ORDER_STATUS_TEMPLATE_ID:}
